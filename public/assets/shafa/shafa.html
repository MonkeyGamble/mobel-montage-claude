<title>Збирання шафи</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: the pencil sketch on its own white sheet, a quiet step caption underneath */
:root{
  --paper:#eeeeec; --sheet:#ffffff; --sheet-edge:#dededb;
  --ink:#2b2d30; --ink-soft:#6a6e73; --accent:#9a4a28;
  --dim-ink:#4a4a4a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1c1d1f; --sheet-edge:#33363a; --ink:#e7e7e4; --ink-soft:#9ea2a7; --accent:#e0956f; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1c1d1f; --sheet-edge:#33363a; --ink:#e7e7e4; --ink-soft:#9ea2a7; --accent:#e0956f; color-scheme:dark }

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:600;font-size:1.7rem;margin:0;text-wrap:balance}
.spec{font-family:var(--f-display);font-weight:500;font-size:1.05rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
/* the sheet stays white in both themes: it is the paper the sketch was drawn on */
.sheet{background:var(--sheet);border:1px solid var(--sheet-edge);border-radius:4px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.dim path{stroke:var(--dim-ink);stroke-width:2.4;fill:none;stroke-linecap:round}
.dim polygon{fill:var(--dim-ink)}
.dim text{font-family:var(--f-body);font-weight:300;font-size:40px;fill:#333;
  paint-order:stroke;stroke:#fff;stroke-width:16px;stroke-linejoin:round}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.step{font-family:var(--f-display);font-weight:500;font-size:1.15rem;min-height:1.5em;display:flex;gap:10px;align-items:baseline}
.step b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.95rem;letter-spacing:.06em}
button{font:500 .95rem var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--ink-soft);
  border-radius:3px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;gap:8px}
</style>

<div class="wrap">
  <header>
    <h1>Збирання шафи</h1>
    <span class="spec">100 × 60 × 200 см</span>
  </header>
  <div class="sheet">
    <svg id="stage" viewBox="80 160 880 1260" role="img"
         aria-label="Анімація: деталі шафи по черзі з'їжджаються з різних боків і складають шафу, потім малюються розміри 200, 100 і 60 сантиметрів">
      <defs id="defs"></defs>
      <rect x="80" y="160" width="880" height="1260" fill="#fff"/>
      <g id="pieces"></g>
      <g id="dims"></g>
    </svg>
  </div>
  <div class="bar">
    <div class="step" aria-live="polite"><b id="stepNo"></b><span id="stepName"></span></div>
    <div class="controls">
      <button id="slow" type="button" aria-pressed="false">Повільно</button>
      <button id="replay" type="button">Повторити</button>
    </div>
  </div>
</div>

    { name: "Задня стінка",   step: 0,  from: "top",    parts: [["back",  [[345,311],[714,274],[714,1192],[345,1170]]]] },

  // grow a polygon a few pixels so each piece keeps its pencil outline
  function grow(poly, d) {
    let area = 0;
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
      area += x1 * y2 - x2 * y1;
    }
    const sgn = area > 0 ? 1 : -1, n = poly.length;
    return poly.map((p, i) => {
      const a = poly[(i - 1 + n) % n], b = poly[(i + 1) % n];
      const n1 = norm([(p[1] - a[1]) * sgn, -(p[0] - a[0]) * sgn]);
      const n2 = norm([(b[1] - p[1]) * sgn, -(b[0] - p[0]) * sgn]);
      const m = norm([n1[0] + n2[0], n1[1] + n2[1]]);
      const cos = Math.max(0.5, m[0] * n1[0] + m[1] * n1[1]);
      return [p[0] + m[0] * d / cos, p[1] + m[1] * d / cos];
    });
  }
  const norm = v => { const L = Math.hypot(v[0], v[1]) || 1; return [v[0] / L, v[1] / L]; };
  const ptsStr = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

  const defs = document.getElementById("defs"), layer = document.getElementById("pieces");
  let cpn = 0;

      for (const poly of polys) el("polygon", { points: ptsStr(grow(poly, 2.5)) }, cp);

    }
  });

  const dimsG = document.getElementById("dims");
  function head(tip, from) {
    const [ux, uy] = norm([tip[0] - from[0], tip[1] - from[1]]), nx = -uy, ny = ux;
    const L = 26, W = 9, notch = 7;
    const b = [tip[0] - ux * L, tip[1] - uy * L], c = [tip[0] - ux * (L - notch), tip[1] - uy * (L - notch)];
    return ptsStr([tip, [b[0] + nx * W, b[1] + ny * W], c, [b[0] - nx * W, b[1] - ny * W]]);
  }
  function dim(a, b, label, lx, ly) {
    const g = el("g", { class: "dim" }, dimsG);
    const line = el("path", { d: `M${a[0]},${a[1]} L${b[0]},${b[1]}`, pathLength: 1 }, g);

    el("polygon", { points: head(a, b) }, heads);
    el("polygon", { points: head(b, a) }, heads);
    const t = el("text", { x: lx, y: ly, "text-anchor": "middle", "dominant-baseline": "central" }, g);

    return { line, heads, t };

    stepName.textContent = name;
  };
  function stop() { anims.forEach(a => a.cancel()); anims = []; timers.forEach(clearTimeout); timers = []; }

  function play() {
    stop();
    const k = 1 / speed, DUR = 800 * k, GAP = 520 * k, T0 = 300 * k;
    if (reduce) { setCaption(total, "Готово"); dimsIn(true, 0, 1); return; }
    ordered.forEach((p, i) => {
      const [dx, dy] = FROM[p.from], delay = T0 + i * GAP;
      anims.push(p.g.animate([
        { transform: `translate(${dx}px,${dy}px)`, opacity: 0 },
        { opacity: 1, offset: 0.3 },
        { transform: "translate(0,0)", opacity: 1 }
      ], { duration: DUR, delay, easing: "cubic-bezier(.2,.85,.25,1)", fill: "both" }));
      timers.push(setTimeout(() => setCaption(i + 1, p.name), delay));
    });
    const dStart = T0 + ordered.length * GAP + DUR * 0.7;
    timers.push(setTimeout(() => setCaption(total, "Розміри"), dStart));
    dimsIn(false, dStart, k);
  }
  function dimsIn(instant, start, k) {
    dims.forEach((d, i) => {
      const t0 = start + i * 750 * k;
      const o = (dur, delay) => ({ duration: instant ? 0 : dur, delay: instant ? 0 : delay, fill: "both", easing: "ease-out" });
      anims.push(d.line.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], o(700 * k, t0)));
      anims.push(d.heads.animate([{ opacity: 0 }, { opacity: 1 }], o(200 * k, t0 + 620 * k)));
      anims.push(d.t.animate([{ opacity: 0 }, { opacity: 1 }], o(400 * k, t0 + 650 * k)));
    });
  }

  document.getElementById("replay").addEventListener("click", play);
  const slow = document.getElementById("slow");
  slow.addEventListener("click", () => {
    speed = speed === 1 ? 0.5 : 1;
    slow.setAttribute("aria-pressed", String(speed !== 1));
    slow.textContent = speed === 1 ? "Повільно" : "Звичайно";
    play();
  });
